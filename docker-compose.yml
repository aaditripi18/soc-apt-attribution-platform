# Gate G0.7 — reproducible local platform bring-up (Elasticsearch + Kibana).
#
# Scope (docs/architecture/13-phase-0-implementation-plan.md G0.7,
# docs/architecture/12-deployment-and-endpoint-scope.md C0.2 §A.1/§E/§I/§J):
#   - single-node Elasticsearch + Kibana, self-managed Basic (free) tier
#   - security ON (authentication + TLS on both the HTTP and transport layers)
#     even in dev — this is an owner-mandated, non-negotiable requirement
#   - pinned image versions (see STACK_VERSION below) for reproducibility
#   - Elasticsearch data in a named volume (survives `docker compose down`;
#     removed only by an explicit `docker compose down -v`)
#   - depends only on Docker Compose semantics, not Docker Desktop specifically
#     (Podman Compose / Rancher Desktop / a native WSL2 Docker engine all work)
#
# Deliberately NOT in this compose file (per G0.7 scope): the Attribution
# Engine, API, or frontend containers. Doc 13's G0.7 gate text is explicit
# that those are "slotted into this same compose as they land (G0.8/G0.10)"
# — none of that application logic exists yet, so no placeholder container
# is added here merely to look complete. The native Windows endpoint
# collector (G0.11) is never containerized (C0.2 §C Option 2 is rejected)
# and so never appears in this file either.
#
# One-command bring-up (see README.md "Platform stack" for full instructions):
#   cp .env.example .env      # or .env.constrained.example on an 8 GB host
#   docker compose up -d
#
# The `version:` key is deliberately omitted — the Compose Specification (the
# current `docker compose` CLI) does not require it and treats it as obsolete.

services:
  # One-shot init container: generates a self-signed CA + per-node TLS certs
  # into a shared volume, then sets the kibana_system service-account
  # password via the Elasticsearch security API. This is Elastic's own
  # documented pattern for bringing up security-enabled Elasticticsearch +
  # Kibana under Docker Compose without a manual enrollment-token step.
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:?Set STACK_VERSION in your .env file (copy .env.example)}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in your .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in your .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions";
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 {} \;;
        find . -type f -exec chmod 640 {} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 5; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 5; done;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  es01:
    depends_on:
      setup:
        condition: service_healthy
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:?Set STACK_VERSION in your .env file (copy .env.example)}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT:-9200}:9200
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME:-attribution-platform-dev}
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?Set ELASTIC_PASSWORD in your .env file (copy .env.example)}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      # Self-managed Basic (free) tier only — no paid features, no trial
      # license (ADR-0001 D14; C0.2 §K non-goals).
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
    mem_limit: ${ES_MEM_LIMIT:-2g}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  kibana:
    depends_on:
      es01:
        condition: service_healthy
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:?Set STACK_VERSION in your .env file (copy .env.example)}
    volumes:
      - certs:/usr/share/kibana/config/certs
      - kibanadata:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT:-5601}:5601
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:?Set KIBANA_PASSWORD in your .env file (copy .env.example)}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
    mem_limit: ${KB_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 120

volumes:
  # Shared CA + per-node TLS material generated once by `setup`.
  certs:
    driver: local
  # Elasticsearch's persistent data directory — a NAMED volume (not a bind
  # mount), per G0.7 requirement. Survives `docker compose down`; only
  # `docker compose down -v` removes it.
  esdata01:
    driver: local
  kibanadata:
    driver: local
