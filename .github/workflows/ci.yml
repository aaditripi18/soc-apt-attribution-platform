name: CI

on:
  push:
  pull_request:

# G0.0 scope only: formatting, linting, type checks, and unit tests.
# No Elasticsearch, Docker, or Windows-specific steps exist yet — those are
# introduced by later Phase-0 gates (see
# docs/architecture/13-phase-0-implementation-plan.md).
jobs:
  checks:
    name: Format, lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (dev)
        run: pip install -e ".[dev]"

      - name: Ruff — format check
        run: ruff format --check .

      - name: Ruff — lint
        run: ruff check .

      - name: Mypy — type check
        run: mypy

      - name: Pytest — unit tests
        run: pytest
