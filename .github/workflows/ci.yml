name: CI

on:
  push:
  pull_request:

# Formatting, linting, strict type checks and the full test suite (unit, golden
# real-record, end-to-end and reproducibility tests). The live Elasticsearch tests are
# opt-in (ATTRIBUTION_LIVE_ELASTICSEARCH=1) and run locally against the docker-compose stack.
jobs:
  checks:
    name: Format, lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project (dev)
        run: pip install -e ".[dev]"

      - name: Ruff — format check
        run: ruff format --check .

      - name: Ruff — lint
        run: ruff check .

      - name: Mypy — type check
        run: mypy

      - name: Pytest — unit tests
        run: pytest
